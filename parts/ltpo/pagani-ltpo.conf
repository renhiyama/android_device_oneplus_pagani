# Pagani LTPO daemon config — read every iteration, live-editable.
# Lives at /vendor/etc/pagani-ltpo.conf on the device.
#
# Panel-supported floors: 1, 10, 20, 30, 60, 90, 120
#   1   = max battery savings (deepest LTPO, default)
#   10  = OOS "bright environment" default — flicker-safer in well-lit rooms
#   30  = conservative (matches qsync_min_refresh_rate from DTSI)
#   60  = effectively no LTPO — panel always at 60+ Hz
TARGET_MIN_FPS=1

# Polling interval in seconds. 0.1 = 10x/sec.
INTERVAL=0.1

# How often (in iterations) to log current state to logcat under tag
# "pagani_ltpo". 300 * INTERVAL(0.1s) = every 30s. Set to a very large
# value to effectively disable.
LOG_INTERVAL=300

# Note: IDLE_MODE bit (deeper power saving via MIPI link drop) is now
# controlled via the Settings UI under Display, which writes the
# persist.sys.pagani_ltpo_idle property. init.pagani-ltpo.rc reacts to
# the property and writes adfr_config directly.
